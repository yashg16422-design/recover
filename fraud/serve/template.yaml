AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Graph fraud score lookup (FastAPI + Mangum on Lambda behind an HTTP API, kept warm by EventBridge). Not deployed unless you run sam deploy.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Existing S3 bucket that holds the artifacts (you create it and upload; see DEPLOY_AWS.md)
  ArtifactPrefix:
    Type: String
    Default: fraud-artifacts
    Description: Key prefix inside the bucket (no leading or trailing slash)

Resources:
  FraudLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  # The API is public (no auth by design: it serves scores for a public Bitcoin dataset). Throttling
  # caps what anyone can do to it: 10 requests/second sustained, bursts of 20.
  FraudApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  FraudFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.handler # app.py -> handler(event, context): Mangum for HTTP events, direct reply for the keep-warm ping
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512 # artifacts are ~7 MB; 512 MB mainly buys CPU for a faster cold start
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref FraudLogGroup
      Environment:
        Variables:
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          ARTIFACT_PREFIX: !Ref ArtifactPrefix
      Policies:
        - Statement: # read-only, scoped to the artifact prefix only
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactPrefix}/*
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref FraudApi
            Path: /{proxy+}
            Method: ANY
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Keeps one container warm so the first real request is not a cold start

Outputs:
  BaseUrl:
    Description: Use as FRAUD_URL for the Recover app and as base_url in the Postman "aws" environment
    Value: !Sub https://${FraudApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
